name: End-to-End ML Pipeline

on:
  push:
    branches: [ main ]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Linter
        run: echo "Virtual linting... Passed!"

  train:
    needs: linter
    if: success() && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[run-train]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt mlflow dvc
        
      - name: Pull Data via DVC
        # Assuming you have configured remote storage, DVC pulls the exact data version
        run: dvc pull || echo "Skipping DVC pull since it's not configured..."
        
      - name: Train and Log to MLflow
        run: |
          python gan_script.py > error_logs.txt 2>&1
          if [ $? -ne 0 ]; then
            cat error_logs.txt
            exit 1
          fi
        
      - name: Persist Run ID and DB
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: |
            model_info.txt
            mlflow.db
          
      - name: Prepare Error Logs
        if: failure()
        run: touch error_logs.txt && echo "Pipeline failure recorded." >> error_logs.txt
          
      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: error_logs.txt
          
      - name: Cleanup Cloud Volumes
        if: always()
        run: echo "Cleaning up temporary cloud volumes..."

  deploy:
    needs: train # Wait for train to pass before deploying
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install mlflow
        
      - name: Download Run ID Artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info
          
      - name: Enforce Performance Threshold
        run: python validate_model.py
        
      - name: Containerize (Mock Build)
        run: |
          # Read the artifact file
          MODEL_RUN_ID=$(cat model_info.txt)
          echo "Building Docker image for Run ID: $MODEL_RUN_ID"
          
          # Pass the Run ID into the Dockerfile as a build argument
          docker build -f DockerFile --build-arg RUN_ID="$MODEL_RUN_ID" -t my-ml-app:latest .